# CI for FelpsXP repositories.
# - hygiene: pre-commit hooks on every file + gitleaks over the full git history
# - node / python: one job per project root found (package.json / pyproject.toml), none if absent
# Actions are pinned to commit SHAs (tag in the comment); Dependabot keeps them current.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  PRE_COMMIT_VERSION: 4.7.0

jobs:
  hygiene:
    name: Hygiene & secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit on all files
        env:
          # no-commit-to-branch would fail on pushes to main; gitleaks runs below on full history.
          SKIP: no-commit-to-branch,gitleaks
        run: |
          pip install "pre-commit==${PRE_COMMIT_VERSION}"
          pre-commit run --all-files --show-diff-on-failure --color=always

      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf "${tarball}" gitleaks
          rm -f "${tarball}" checksums.txt

      - name: Scan full history for secrets
        run: ./gitleaks git . --redact --no-banner --verbose

  detect:
    name: Detect stack
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      node: ${{ steps.stack.outputs.node }}
      python: ${{ steps.stack.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A project root holds the manifest and has no ancestor that also holds one: a workspace
      # at the repository root covers its own packages, while apps/api and tools/dev stand alone.
      - id: stack
        run: |
          roots() {
            git ls-files -- ":(glob)$1" ":(glob)**/$1" | xargs -r -d '\n' -n1 dirname | LC_ALL=C sort -u |
              awk 'BEGIN { printf "[" }
                   { nested = ("." in kept); for (k in kept) if (index($0, k "/") == 1) nested = 1
                     if (!nested) { kept[$0] = 1; printf "%s\"%s\"", sep, $0; sep = "," } }
                   END { print "]" }'
          }
          echo "node=$(roots package.json)" >> "$GITHUB_OUTPUT"
          echo "python=$(roots pyproject.toml)" >> "$GITHUB_OUTPUT"

  node:
    name: Node checks (${{ matrix.dir }})
    needs: detect
    if: needs.detect.outputs.node != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.detect.outputs.node) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ${{ matrix.dir }}/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: ${{ matrix.dir }}/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (production, high and above)
        run: pnpm audit --prod --audit-level=high
      - run: pnpm run --if-present lint
      - run: pnpm run --if-present typecheck
      - run: pnpm run --if-present test
      - run: pnpm run --if-present build

  python:
    name: Python checks (${{ matrix.dir }})
    needs: detect
    if: needs.detect.outputs.python != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.detect.outputs.python) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          if [ -f uv.lock ]; then uv sync --locked --all-extras; else uv sync --all-extras; fi

      - name: Dependency audit
        run: |
          if [ -f uv.lock ]; then
            uv export --frozen --no-dev --no-emit-project --quiet -o "${RUNNER_TEMP}/requirements.txt"
            uvx pip-audit==2.10.1 --disable-pip --progress-spinner off -r "${RUNNER_TEMP}/requirements.txt"
          else
            echo "No uv.lock yet; nothing to audit."
          fi

      - name: Lint and format check
        run: |
          uv run --with ruff ruff check .
          uv run --with ruff ruff format --check .

      - name: Tests
        run: |
          if [ -d tests ]; then uv run --with pytest pytest; else echo "No tests/ directory yet."; fi
