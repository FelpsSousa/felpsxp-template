# PRs are squash-merged, so the PR title becomes the commit on main.
# This check enforces Conventional Commits on the title.
name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout: the PR's code is never executed with pull_request_target privileges.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            security
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase letter.

      # Skips Dependabot: its bodies quote upstream release notes this repository does not write.
      - name: No AI attribution footer in the description
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s\n' "$PR_BODY" | grep -Eiq '^[[:space:]]*(co-authored-by:.*(claude|anthropic)|[^[:space:]]*[[:space:]]*generated with .*claude)'; then
            echo "::error::Remove the AI attribution footer: disclosure lives in AI.md."
            exit 1
          fi
